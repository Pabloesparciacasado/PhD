name: Local Coding
version: 0.0.1
schema: v1

models:
  - name: Qwen 2.5 Coder 14B
    provider: lmstudio
    model: qwen/qwen2.5-vl-7b
    apiBase: http://localhost:1234/v1
    roles:
      - chat
      - edit
      - apply
      - autocomplete






